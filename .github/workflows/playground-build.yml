name: Swift Playgrounds Build

on:
  pull_request:
    branches: [ main ]

jobs:
  playground:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode
        run: xcodebuild -version

      - name: List Swift Playgrounds package
        working-directory: Playgrounds/BMWMirrorPad.swiftpm
        run: xcodebuild -list

      - name: Build BMW Mirror Pad for iOS Simulator
        working-directory: Playgrounds/BMWMirrorPad.swiftpm
        run: |
          set -o pipefail
          xcodebuild \
            -scheme "BMW Mirror Pad" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
