name: Swift Playgrounds Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  playground:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Playground preflight
        run: bash Scripts/playground-preflight.sh

      - name: Show Xcode
        run: xcodebuild -version

      - name: List Swift Playgrounds package
        working-directory: Playgrounds/BMWMirrorPad.swiftpm
        run: xcodebuild -list

      - name: Package verified iPad playground
        run: |
          rm -rf build-artifact
          mkdir -p build-artifact
          cp -R Playgrounds/BMWMirrorPad.swiftpm build-artifact/BMWMirrorPad-Final-R3.swiftpm
          ditto -c -k --sequesterRsrc --keepParent \
            build-artifact/BMWMirrorPad-Final-R3.swiftpm \
            build-artifact/BMWMirrorPad-Final-R3.swiftpm.zip

      - name: Build BMW Mirror Pad for iOS Simulator
        working-directory: Playgrounds/BMWMirrorPad.swiftpm
        run: |
          set -o pipefail
          xcodebuild \
            -scheme "BMW Mirror Pad Final R3" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Upload verified iPad package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BMWMirrorPad-Final-R3
          path: build-artifact/BMWMirrorPad-Final-R3.swiftpm.zip
          if-no-files-found: error
          retention-days: 7
