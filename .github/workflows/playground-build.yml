name: Swift Playgrounds Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  playground:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Playground preflight
        run: bash Scripts/playground-preflight.sh

      - name: Show Xcode
        run: xcodebuild -version

      - name: List Swift Playgrounds package
        working-directory: Playgrounds/BMWMirrorPad.swiftpm
        run: xcodebuild -list

      - name: Build BMW Mirror Pad for iOS Simulator
        working-directory: Playgrounds/BMWMirrorPad.swiftpm
        run: |
          set -o pipefail
          xcodebuild \
            -scheme "BMW Mirror Pad" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package final Swift Playground
        run: |
          ditto -c -k --sequesterRsrc --keepParent             Playgrounds/BMWMirrorPad.swiftpm             BMWMirrorPad-Final.swiftpm.zip

      - name: Upload final Swift Playground
        uses: actions/upload-artifact@v4
        with:
          name: BMWMirrorPad-Final
          path: BMWMirrorPad-Final.swiftpm.zip
          if-no-files-found: error
